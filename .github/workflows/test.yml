name: tests

# Thin wrapper: CI calls the same commands a dev runs (AGENTS.md "Dev loop"). No logic here.
on:
  push:
    branches: [v0-dev, main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    # The self-tests against fake binaries; no duckdb build, no docker, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: uvx ruff check .
      - name: Offline suite
        run: uv run --all-extras --group dev pytest -q
