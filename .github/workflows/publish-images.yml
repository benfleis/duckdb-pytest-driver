name: publish-images

# Manual image publishing. The namespace defaults to ghcr.io/<repo owner>; override it per run with the
# `namespace` input.
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "ghcr namespace to publish into (default: ghcr.io/<repo owner>)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only the repo owner may publish. The `publish` environment can add reviewer approval.
    if: github.actor == github.repository_owner
    environment: publish
    # One runner covers all platforms: mirrors use `pull --platform`; builds use buildx.
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled  # some docker builds gate `docker manifest` on this
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve namespace
        # ghcr rejects mixed-case repository names.
        run: |
          ns='${{ inputs.namespace }}'
          [ -n "$ns" ] || ns="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          echo "DUCKTEST_IMAGE_NS=$(echo "$ns" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to ghcr
        # GHCR_PAT is only needed when publishing outside ghcr.io/<repo owner>.
        run: echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Publish
        run: uv run ducktest publish-images --push
      # Mirrors need a manifest-stitching pass; build images are skipped by --finalize.
      - name: Finalize multi-arch manifests
        run: uv run ducktest publish-images --finalize --push
