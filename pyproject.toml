[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdb-ducktest"
version = "0.2.0"
description = "Runs duckdb .test (SQLLogic) files through the unittest binary, plus Python test bodies, with the services, storages and credentials a repo declares."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "DuckDB contributors" }]
keywords = ["duckdb", "sqllogic", "testing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6"]

[dependency-groups]
# The runner does not use pytest; its self-tests do.
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/duckdb/duckdb"

[project.scripts]
ducktest = "ducktest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
format.quote-style = "preserve"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
