[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdb-pytest-driver"
version = "0.1.0"
description = "Generic pytest front-end over the duckdb unittest (Catch2) binary: collect & run .test files, Python drivers, @requires provisioning."
readme = "README.md"
# >=3.9: str.removeprefix (plugin.py terminal-summary) is 3.9+; back-compat isn't a goal.
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "DuckDB contributors" }]
keywords = ["duckdb", "pytest", "sqllogic", "testing"]
classifiers = [
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# >=7.4: the pytest_ignore_collect hook uses the collection_path arg (added in 7.4).
dependencies = ["pytest>=7.4"]

[project.optional-dependencies]
xdist = ["pytest-xdist"]

[project.urls]
Homepage = "https://github.com/duckdb/duckdb"

# Auto-registers the plugin in any pytest process that has this package installed —
# replaces the old `pytest_plugins = ["ducktest.plugin"]` line + sys.path hacks.
[project.entry-points.pytest11]
ducktest = "ducktest.plugin"

# `ducktest` front-end (currently: `ducktest configure`) — writes the base pytest
# config a plugin can't inject, so bare `pytest` works afterward.
[project.scripts]
ducktest = "ducktest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktest"]

# Scope the package's own `pytest` run to its self-tests; the runnable examples under
# examples/ are collected only when targeted explicitly (`pytest examples/...`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
